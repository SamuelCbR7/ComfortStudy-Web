<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComfortStudy - Calendário de Estudos</title>
  <link rel="stylesheet" href="style_dashboard.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho da página */
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-voltar {
      background-color: #334155;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-voltar:hover {
      background-color: #475569;
    }

    /* Layout principal */
    .main-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
    }

    .card-calendar {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 30px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* Formulário */
    .form-group {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr auto;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .form-group {
        grid-template-columns: 1fr;
      }
    }

    input, select, button {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    button.btn-add {
      background-color: #0284c7;
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-add:hover {
      background-color: #0369a1;
    }

    /* Lista de compromissos */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-card {
      background-color: #0f172a;
      border-left: 4px solid #38bdf8;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-card.prova { border-left-color: #ef4444; }
    .event-card.trabalho { border-left-color: #f59e0b; }
    .event-card.revisao { border-left-color: #10b981; }

    .event-info h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .event-info span {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-delete:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <header>
    <a href="index_2.html" class="logo">
      🎓 ComfortStudy
    </a>
    <a href="index_2.html" class="btn-voltar">← Voltar ao Inicio</a>
  </header>

  <main class="main-container">
    <div class="card-calendar">
      <h1>📅 Agenda & Calendário</h1>
      <p class="subtitle">Organize suas provas, revisões e entregas de trabalhos num só lugar.</p>

      <!-- Formulário de adição -->
      <form id="formEvento" class="form-group">
        <input type="text" id="titulo" placeholder="Título (ex: Prova de História)" required>
        <input type="date" id="data" required>
        <select id="categoria">
          <option value="prova">🔴 Prova</option>
          <option value="trabalho">🟡 Trabalho</option>
          <option value="revisao">🟢 Revisão</option>
        </select>
        <button type="submit" class="btn-add">+ Agendar</button>
      </form>

      <!-- Lista onde aparecem os eventos -->
      <div id="listaEventos" class="events-list">
        <!-- Eventos inseridos dinamicamente aqui -->
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("formEvento");
      const lista = document.getElementById("listaEventos");

      // Carregar dados salvos no navegador
      let compromissos = JSON.parse(localStorage.getItem("cs_compromissos")) || [];

      function renderizar() {
        lista.innerHTML = "";

        if (compromissos.length === 0) {
          lista.innerHTML = `<div class="empty-state">Nenhum compromisso agendado ainda.</div>`;
          return;
        }

        // Ordenar por data mais próxima
        compromissos.sort((a, b) => new Date(a.data) - new Date(b.data));

        compromissos.forEach((item, index) => {
          const dataFormatada = item.data.split("-").reverse().join("/");
          const card = document.createElement("div");
          card.className = `event-card ${item.categoria}`;
          
          card.innerHTML = `
            <div class="event-info">
              <h3>${item.titulo}</h3>
              <span>📅 Data: ${dataFormatada}</span>
            </div>
            <button class="btn-delete" onclick="removerItem(${index})" title="Remover">🗑️</button>
          `;

          lista.appendChild(card);
        });
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const titulo = document.getElementById("titulo").value;
        const data = document.getElementById("data").value;
        const categoria = document.getElementById("categoria").value;

        compromissos.push({ titulo, data, categoria });
        localStorage.setItem("cs_compromissos", JSON.stringify(compromissos));

        form.reset();
        renderizar();
      });

      window.removerItem = (index) => {
        compromissos.splice(index, 1);
        localStorage.setItem("cs_compromissos", JSON.stringify(compromissos));
        renderizar();
      };

      renderizar();
    });
  </script>
</body>
</html>
