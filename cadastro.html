<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ComfortStudy - Calendário & Agenda</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: var(--card-bg);
      color: var(--text);
    }

    main {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--text);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    input, select {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button[type="submit"] {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    .events-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .event-item {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-item.prova { border-left-color: #ef4444; }
    .event-item.trabalho { border-left-color: #f59e0b; }
    .event-item.revisao { border-left-color: #10b981; }

    .event-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .event-info p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      font-size: 1rem;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-msg {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>📅 Agenda ComfortStudy</h1>
    <a href="index_2.html" class="btn-back">← Voltar ao Painel</a>
  </header>

  <main>
    <!-- FORMULÁRIO DE CADASTRO -->
    <section class="card">
      <h2>Novo Compromisso</h2>
      <form id="eventForm">
        <div class="form-group">
          <label for="eventTitle">Título do evento / prova</label>
          <input type="text" id="eventTitle" placeholder="Ex: Prova de Matemática" required />
        </div>

        <div class="form-group">
          <label for="eventDate">Data de entrega / realização</label>
          <input type="date" id="eventDate" required />
        </div>

        <div class="form-group">
          <label for="eventType">Categoria</label>
          <select id="eventType">
            <option value="prova">🔴 Prova / Teste</option>
            <option value="trabalho">🟡 Trabalho / Entrega</option>
            <option value="revisao">🟢 Revisão / Estudo</option>
          </select>
        </div>

        <button type="submit">Agendar Evento</button>
      </form>
    </section>

    <!-- LISTA DE EVENTOS -->
    <section class="card">
      <h2>Próximos Eventos</h2>
      <ul id="eventsList" class="events-list"></ul>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("eventForm");
      const list = document.getElementById("eventsList");

      let events = JSON.parse(localStorage.getItem("comfortstudy_agenda")) || [];

      function saveAndRender() {
        localStorage.setItem("comfortstudy_agenda", JSON.stringify(events));
        render();
      }

      function render() {
        list.innerHTML = "";

        if (events.length === 0) {
          list.innerHTML = `<li class="empty-msg">Nenhum compromisso agendado.</li>`;
          return;
        }

        // Ordena por data (mais recente primeiro)
        events.sort((a, b) => new Date(a.date) - new Date(b.date));

        events.forEach((ev, index) => {
          const li = document.createElement("li");
          li.className = `event-item ${ev.type}`;

          const formattedDate = ev.date.split("-").reverse().join("/");

          li.innerHTML = `
            <div class="event-info">
              <h3>${ev.title}</h3>
              <p>📅 ${formattedDate}</p>
            </div>
            <button class="btn-delete" title="Excluir" onclick="deleteEvent(${index})">🗑️</button>
          `;

          list.appendChild(li);
        });
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("eventTitle").value;
        const date = document.getElementById("eventDate").value;
        const type = document.getElementById("eventType").value;

        events.push({ title, date, type });
        saveAndRender();

        form.reset();
      });

      window.deleteEvent = (index) => {
        events.splice(index, 1);
        saveAndRender();
      };

      render();
    });
  </script>
</body>
</html>
